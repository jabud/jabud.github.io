<script>
(() => {
  const root = document.documentElement;
  const body = document.body;

  // Nombres bonitos para los segmentos de la ruta: las carpetas del repo están
  // sin acentos, pero en pantalla queremos leerlas en español.
  const LABELS = { notas: "notas", resenas: "reseñas", projects: "proyectos" };

  // Los iconos del menú, calcados del sitio en Astro (Feather, trazo de 2px).
  // Quarto solo admite nombres de Bootstrap Icons en `_quarto.yml`, así que los
  // suyos se declaran ahí como respaldo y aquí se sustituyen por estos.
  const SIDEBAR_ICONS = {
    "notas/":
      '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    "resenas/":
      '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    "projects/":
      '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  };

  const useAstroIcons = () => {
    document
      .querySelectorAll("#quarto-sidebar .sidebar-item-container a")
      .forEach((link) => {
        const href = link.getAttribute("href") || "";
        const key = Object.keys(SIDEBAR_ICONS).find((k) => href.includes(k));
        const placeholder = key && link.querySelector("i.bi");
        if (!placeholder) return;

        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );
        svg.setAttribute("class", "nav-icon");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "2");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        svg.innerHTML = SIDEBAR_ICONS[key];
        placeholder.replaceWith(svg);
      });
  };

  // ------------------------------------------------------------------
  // 1. Ruta estilo terminal junto al ~ de la barra superior
  // ------------------------------------------------------------------
  const buildBreadcrumb = () => {
    const brand = document.querySelector(".navbar-brand-container");
    if (!brand || document.querySelector(".terminal-path")) return;

    const segments = location.pathname.split("/").filter(Boolean);
    if (segments.length === 0) return;

    const path = document.createElement("span");
    path.className = "terminal-path";

    segments.forEach((raw, i) => {
      const isLast = i === segments.length - 1;
      const slug = raw.replace(/\.html$/, "");
      // index.html de una sección no aporta nada: la carpeta ya se muestra.
      if (slug === "index") return;

      path.append("/");
      const label = LABELS[slug] || slug;

      if (isLast) {
        const current = document.createElement("span");
        current.className = "seg-current";
        current.textContent = label;
        path.append(current);
      } else {
        const link = document.createElement("a");
        link.href = "/" + segments.slice(0, i + 1).join("/") + "/";
        link.textContent = label;
        path.append(link);
      }
    });

    if (path.childNodes.length) brand.append(path);
  };

  // ------------------------------------------------------------------
  // 2. Menú lateral colapsable
  // ------------------------------------------------------------------
  // Quarto reserva una columna del grid para el sidebar mientras el body tenga
  // las clases `nav-sidebar docked`. Al quitarlas, el contenido se recentra solo
  // usando el layout que Quarto ya trae para páginas sin menú, y el sidebar pasa
  // a flotar fijo con solo los iconos. Es menos frágil que reescribir el grid.
  // Por debajo de este ancho Quarto guarda el menú tras su hamburguesa y
  // maneja el layout a su manera: ahí no hay que colapsar nada.
  const isWideScreen = () => window.matchMedia("(min-width: 992px)").matches;

  const applySidebarState = (collapsed) => {
    const active = collapsed && isWideScreen();
    root.dataset.sidebar = active ? "collapsed" : "expanded";
    body.classList.toggle("nav-sidebar", !active);
    body.classList.toggle("docked", !active);
  };

  const setupSidebarToggle = () => {
    const sidebar = document.querySelector("#quarto-sidebar");
    if (!sidebar || document.querySelector(".collapse-btn")) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "collapse-btn";
    button.innerHTML =
      '<span class="collapse-chevron" aria-hidden="true"></span>' +
      '<span class="collapse-label">colapsar</span>';

    const sync = (collapsed) => {
      button.setAttribute("aria-expanded", String(!collapsed));
      button.setAttribute(
        "aria-label",
        collapsed ? "Expandir el menú" : "Colapsar el menú"
      );
    };

    button.addEventListener("click", () => {
      const collapsed = root.dataset.sidebar !== "collapsed";
      applySidebarState(collapsed);
      sync(collapsed);
      try {
        localStorage.setItem("sidebar", collapsed ? "collapsed" : "expanded");
      } catch (e) {
        /* modo privado: el estado simplemente no se recuerda */
      }
    });

    sidebar.append(button);

    const storedCollapsed = () => {
      try {
        return localStorage.getItem("sidebar") === "collapsed";
      } catch (e) {
        return false;
      }
    };

    const restore = () => {
      const collapsed = storedCollapsed();
      applySidebarState(collapsed);
      sync(collapsed);
    };

    restore();
    // Al cruzar el umbral (rotar el teléfono, redimensionar) hay que rehacerlo,
    // o el menú se queda flotando sobre el contenido en pantalla estrecha.
    window
      .matchMedia("(min-width: 992px)")
      .addEventListener("change", restore);
  };

  // ------------------------------------------------------------------
  // 3. Al filtrar por categoría, esconder las secciones que quedan vacías
  // ------------------------------------------------------------------
  // El filtro de Quarto actúa sobre todos los listados de la página, así que en
  // la home puede dejar un encabezado ("Reseñas recientes") sin nada debajo.
  const hideEmptySections = () => {
    // La guardia es tener un listado, no tener entradas: al filtrar, Quarto
    // saca los posts del DOM, así que una sección vacía no tiene ninguno.
    document.querySelectorAll("section.level2").forEach((section) => {
      if (!section.querySelector(".quarto-listing")) return;
      const posts = [...section.querySelectorAll(".quarto-post")];
      section.hidden = !posts.some((post) => post.style.display !== "none");
    });
  };

  const watchCategoryFilter = () => {
    const categories = document.querySelectorAll(
      ".quarto-listing-category .category"
    );
    if (!categories.length) return;
    categories.forEach((category) =>
      category.addEventListener("click", () =>
        requestAnimationFrame(hideEmptySections)
      )
    );
    window.addEventListener("hashchange", () =>
      requestAnimationFrame(hideEmptySections)
    );
    // Al cargar con un #category= en la URL, Quarto filtra después de este
    // script, así que la primera pasada va al final de la cola de eventos.
    setTimeout(hideEmptySections, 0);
  };

  // ------------------------------------------------------------------
  // 4. Marcar la sección del menú también dentro de sus páginas
  // ------------------------------------------------------------------
  // Quarto solo resalta el enlace de la página exacta, así que al abrir una
  // nota el menú se queda sin nada marcado. El sitio original resaltaba la
  // sección completa.
  const markActiveSection = () => {
    document
      .querySelectorAll("#quarto-sidebar .sidebar-item-container > a")
      .forEach((link) => {
        const target = new URL(link.getAttribute("href"), location.href);
        const section = target.pathname.replace(/index\.html$/, "");
        if (section !== "/" && location.pathname.startsWith(section)) {
          link.classList.add("active");
        }
      });
  };

  // ------------------------------------------------------------------
  // 5. Enlaces del proyecto (código / sitio) también en móvil
  // ------------------------------------------------------------------
  // Quarto los pone en la columna del margen, que esconde en pantalla
  // estrecha. Se copian bajo el título; el CSS decide cuál de las dos
  // versiones se ve, así no hay nada que rehacer al girar el teléfono.
  const inlineProjectLinks = () => {
    const blocks = document.querySelectorAll(
      "#quarto-margin-sidebar .quarto-other-links, #quarto-margin-sidebar .quarto-code-links"
    );
    const header = document.querySelector("#title-block-header");
    if (!blocks.length || !header) return;

    const wrap = document.createElement("div");
    wrap.className = "project-links-inline";
    blocks.forEach((block) => wrap.append(block.cloneNode(true)));
    header.append(wrap);
  };

  useAstroIcons();
  markActiveSection();
  inlineProjectLinks();
  buildBreadcrumb();
  setupSidebarToggle();
  watchCategoryFilter();
})();
</script>
