project:
  type: website
  output-dir: _site
  render:
    - index.md
    - contexto.md
    - notas/
    - resenas/
    - projects/
    # README y docs/ no son páginas del sitio
    - "!README.md"
    - "!docs/"
  resources:
    - assets/

lang: es

website:
  title: "Resoluble"
  description: "Sitio personal de Jorge Espinoza Abud: proyectos, notas técnicas, reseñas e ideas."
  site-url: https://jabud.github.io
  favicon: favicon.svg
  open-graph: true
  search: false
  navbar:
    title: "~"
    href: index.md
    right:
      - text: contexto
        href: contexto.md
  sidebar:
    style: docked
    contents:
      - text: notas
        icon: file-text
        href: notas/index.md
      - text: reseñas
        icon: book
        href: resenas/index.md
      - text: proyectos
        icon: folder
        href: projects/index.md
  page-footer:
    left: "© 2026 Resoluble"
    right:
      - icon: github
        href: https://github.com/jabud
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jorgeabud/
        aria-label: LinkedIn
      - icon: telegram
        href: https://telegram.me/jorge_abud
        aria-label: Telegram

format:
  html:
    theme:
      light: [cosmo, styles/terminal-light.scss]
      dark: [cosmo, styles/terminal-dark.scss]
    toc: true
    toc-title: "En esta página"
    toc-depth: 3
    # Sin esto el TOC solo despliega la sección activa y los h3 quedan ocultos.
    toc-expand: true
    code-copy: true
    link-external-newwindow: true
    date-format: "D MMM YYYY"
    include-after-body:
      - js/shell.html

execute:
  freeze: auto
